# Build a .deb and publish it as a GitHub release.
#
# Runs only for pushed tags: git tag v0.1.0 && git push origin v0.1.0
# (or `just release`). The tag must match `version` in Cargo.toml.
#
# Built on Ubuntu 24.04 so the package installs on 24.04 LTS and newer.

name: Release .deb

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Check
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build .deb
        id: deb
        run: |
          cargo deb --locked
          deb=$(ls target/debian/*.deb)
          echo "path=${deb}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${deb}")" >> "$GITHUB_OUTPUT"
          dpkg-deb --info "${deb}"
          dpkg-deb --contents "${deb}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deb.outputs.path }}
          generate_release_notes: true
          body: |
            Install on Ubuntu 24.04 or newer:

            ```bash
            sudo apt install ./${{ steps.deb.outputs.name }}
            ```

            Requires [OpenVPN 3 Linux](https://community.openvpn.net/openvpn/wiki/OpenVPN3Linux)
            and a StatusNotifierItem / AppIndicator tray (on GNOME: the AppIndicator extension).
